<!DOCTYPE html>
<html>
<head>
    <title>View Sign-ups</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora&display=swap" rel="stylesheet">
   <style>
        body {
            font-family: 'Sora', sans-serif;
            background-color: #fff0f6;
            padding: 30px;
        }

        h2 {
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #c45c76;
            text-align: center;
        }

        .container {
            background-color: #ffe3ec;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px #f4a7bb;
            max-width: 800px;
            margin: auto;
        }

        select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #c45c76;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #ff8fab;
            color: white;
        }

        th, td {
            border: 1px solid #c45c76;
            padding: 8px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #ffd6e0;
        }

        a {
            color: #c45c76;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .info {
            margin-top: 10px;
            color: #c45c76;
            font-weight: bold;
        }
    </style>
    </style>
</head>
<body>

<h2>View Sign-ups</h2>

<label for="filter">Filter by Club:</label>
<select id="filter" onchange="filterTable()">

</select>

<table>
    <thead>
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>i/e</th>
            <th>Grade</th>
            <th>Club</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<p id="message"></p>
<p id="total"></p>

<a href="Q3_3GCesiumPalec.html">← Back to Sign-up Page</a>

<script>
var allClubs = [
    "The Science Scholar",
    "Lagablab",
    "Bahaghari",
    "MUN",
    "Math Club",
    "Ellipsis",
    "Kislap"
];

var signups = JSON.parse(localStorage.getItem("signups") || "[]");

var filterSelect = document.getElementById("filter");
filterSelect.innerHTML = "<option value='ALL'>ALL</option>";
allClubs.forEach(function(club) {
    filterSelect.innerHTML += "<option value='" + club + "'>" + club + "</option>";
});

showTable(signups);

function showTable(list) {
    var body = document.getElementById("tableBody");
    body.innerHTML = "";

    if (list.length === 0) {
        document.getElementById("message").innerHTML = "No sign-ups yet.";
        document.getElementById("total").innerHTML = "";
        return;
    }

    document.getElementById("message").innerHTML = "";

    list.forEach(function(s) {
        body.innerHTML +=
            "<tr>" +
            "<td>" + s.studentid + "</td>" +
            "<td>" + s.name + "</td>" +
            "<td>" + s.email + "</td>" +
            "<td>" + s.mobile + "</td>" +
            "<td>" + s["i/e"] + "</td>" +
            "<td>" + s.grade + "</td>" +
            "<td>" + s.club + "</td>" +
            "</tr>";
    });

    document.getElementById("total").innerHTML = "Total Sign-ups: " + list.length;
}

function filterTable() {
    var selected = filterSelect.value;

    if (selected === "ALL") {
        showTable(signups);
        return;
    }

    var filtered = signups.filter(function(s) {
        return s.club === selected;
    });

    if (filtered.length === 0) {
        document.getElementById("tableBody").innerHTML = "";
        document.getElementById("message").innerHTML = "No sign-ups for this club yet.";
        document.getElementById("total").innerHTML = "";
    } else {
        showTable(filtered);
    }
}

function clearData() {
    if (confirm("Are you sure you want to delete all signups?")) {
        localStorage.removeItem("signups");
        signups = [];
        showTable(signups);
    }
}
</script>

</body>
</html>
