<!DOCTYPE html>
<html>
<head>
    <title>Sign-up Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora&display=swap" rel="stylesheet">


    <style>
        body {
            font-family: 'Sora', sans-serif;
            background-color: #fff0f6;
            padding: 30px;
        }

        h2 {
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #c45c76;
            text-align: center;
        }

        form {
            background-color: #ffe3ec;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px #f4a7bb;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #c45c76;
        }
        .missing {
            background-color: #ffd6e0;
            border: 2px solid #ff6b8a;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border: 2px solid #ff6b8a;
            background-color: #fff;
        }

        button, input[type="reset"] {
            background-color: #ff8fab;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover, input[type="reset"]:hover {
            background-color: #ff5c8a;
        }

        .actions {
            text-align: center;
        }

        .radio-group {
            display: flex;       
            gap: 90px;          
        }

        .radio-label {
            display: flex;       
            align-items: center; 
            gap: 0;         
            cursor: pointer;
            font-weight: bold;
        }

        #ieWrapper.required-missing {
            border: 2px solid #ff4d6d;
            padding: 5px;
            border-radius: 5px;
        }

    </style>
</head>

<body>

<h2>Student Club Sign-up</h2>

<form onsubmit="submitForm(event)" onreset="resetForm(event)">

    Student ID:
    <input type="number" id="studentid" onblur="missingInfo(this)">

    Full Name:
    <input type="text" id="name" onblur="missingInfo(this)">

    Email:
    <input type="email" id="email" onblur="missingInfo(this)">

    Mobile Number:
    <input type="text" id="mobile">
    <br><br>


<div id="ieWrapper">
    <span>Intern / Extern:</span>
    <div class="radio-group">
        <label class="radio-label">
            <input type="radio" name="i/e" value="Intern">
            <span>Intern</span>
        </label>
        <label class="radio-label">
            <input type="radio" name="i/e" value="Extern">
            <span>Extern</span>
        </label>
    </div>
</div>
    <br>

    Grade Level:
    <select id="grade" onblur="missingInfo(this)">
        <option value="">Select Grade</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>
    </select>

    Preferred Organization / Club:
    <select id="club">
        <option value="The Science Scholar">The Science Scholar</option>
        <option value="Lagablab">Invictus</option>
        <option value="Bahaghari">Bahaghari</option>
        <option value="MUN">MUN</option>
        <option value="Math Club">Math Club</option>
        <option value="Ellipsis">Ellipsis</option>
        <option value="Kislap">Kislap</option>
    </select>

    Why you want to join?
    <textarea id="reason" onblur="missingInfo(this)"></textarea>

    <div class="actions">
        <button type="submit">Submit</button>
        <input type="reset" value="Clear">
        <button type="button" onclick="goToView()">View Sign-ups</button>
    </div>

</form>

<script>
function missingInfo(element) {
    if (element.value === "") {
        element.className = "missing";
    } else {
        element.className = "";
    }
}
function submitForm(event) {
    event.preventDefault();

    var inputs = document.querySelectorAll("input, textarea, select");
    var hasError = false;


var ieRadios = document.getElementsByName("i/e");
var ieChecked = false;
for (var i = 0; i < ieRadios.length; i++) {
    if (ieRadios[i].checked) {
        ieChecked = true;
        break;
    }
}
if (!ieChecked) {
    document.getElementById("ieWrapper").classList.add("required-missing");
    hasError = true;
} else {
    document.getElementById("ieWrapper").classList.remove("required-missing");
}


    for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].value === "") {
            inputs[i].classList.add("required-missing");
            hasError = true;
        } else {
            inputs[i].classList.remove("required-missing");
        }
    }

  
    if (hasError) {
        alert("Please fill in all required fields.");
        return;
    }


    if (confirm("Submit this form?") === false) {
        return;
    }

    var signups = localStorage.getItem("signups");
    if (signups === null) {
        signups = [];
    } else {
        signups = JSON.parse(signups);
    }

var signup = {
    studentid: document.getElementById("studentid").value,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    "i/e": document.querySelector('input[name="i/e"]:checked').value, 
    mobile: document.getElementById("mobile").value,
    grade: document.getElementById("grade").value,
    club: document.getElementById("club").value,
    reason: document.getElementById("reason").value
};


    signups.push(signup);
    localStorage.setItem("signups", JSON.stringify(signups));

    alert("Sign-up saved!");
    document.forms[0].reset();
}

    function resetForm(event) {
        if (confirm("Clear the form?") === false) {
            event.preventDefault();
        }
    }

function goToView() {
    window.location = "viewSignUps.html";
}
</script>

</body>
</html>
