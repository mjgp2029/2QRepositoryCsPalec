<!DOCTYPE html>
<html>
<head>
<title>Add Movie</title>


<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family: Quicksand;
    background: linear-gradient(#ffd6eb,#ffeaf5);
    text-align:center;
}


.box{
    background:white;
    width:320px;
    margin:auto;
    margin-top:40px;
    padding:20px;
    border-radius:12px;
    border:3px solid #ff9ecf;
    box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}


h2{
    color:#ff5fa2;
}


input, select{
    width:90%;
    padding:6px;
    margin:6px;
    border-radius:6px;
    border:1px solid #ffb6da;
}

/* stars */
.star{
    font-size:26px;
    cursor:pointer;
    color:#ccc;
}

.active{
    color:gold;
}


button{
    background:#ff69b4;
    border:none;
    color:white;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    cursor:pointer;
    font-family:Quicksand;
}

button:hover{
    background:#ff4fa3;
}


#list{
    margin-top:15px;
}


.movie{
    background:#fff0f7;
    border:2px solid #ffb6da;
    border-radius:8px;
    padding:8px;
    margin-top:8px;
}

</style>
</head>

<body>

<div class="box">

<h2>Add a Movie</h2>

Title<br>
<input id="title"><br>

Year<br>
<input id="year"><br>

Genre<br>
<select id="genre">
<option>Action</option>
<option>Comedy</option>
<option>Drama</option>
<option>Fantasy</option>
</select>

<p>Rating</p>

<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>

<br>

<button onclick="addMovie()">Add Movie</button>

<h3>Movie List</h3>
<div id="list"></div>

</div>

<script>

let rating = 0;

/* set star rating */
function setRating(num){

    rating = num;

    let stars = document.getElementsByClassName("star");

    for(let i=0;i<stars.length;i++){
        stars[i].classList.remove("active");
    }

    for(let i=0;i<num;i++){
        stars[i].classList.add("active");
    }
}


function addMovie(){

    let title = document.getElementById("title").value;
    let year = document.getElementById("year").value;
    let genre = document.getElementById("genre").value;

    let movie = {
        title:title,
        year:year,
        genre:genre,
        rating:rating
    };

    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    movies.push(movie);

    localStorage.setItem("movies", JSON.stringify(movies));

    showMovies();
}


function showMovies(){

    let list = document.getElementById("list");
    list.innerHTML = "";

    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    for(let i=0;i<movies.length;i++){

        let stars = "★".repeat(movies[i].rating);

        list.innerHTML +=
        "<div class='movie'>" +
        movies[i].title + " (" +
        movies[i].year + ") - " +
        movies[i].genre +
        ", Rating: <span style='color:gold'>" + stars + "</span>" +
        "</div>";
    }
}

showMovies();

</script>

</body>
</html>
